openapi: 3.0.0
info:
  title: ClimateCanary API
  version: 1.0.0
  description: API for out climate monitoring project with RBAC

tags:
  - name: Users
    description: User management
  - name: Roles
    description: Role and permission management
  - name: Absences
    description: Absence management (vacation, illness, etc.)

paths:

  /auth/login:
    post:
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDTO'
      responses:
        '200':
          description: Successful login
        '401':
          description: Unauthorized

  /users:
    get:
      tags: [Users]
      summary: Get all users
      description: Requires CAN_MANAGE_USERS permission
      responses:
        '200':
          description: List of all users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDTO'
        '401':
          description: Unauthorized

    post:
      tags: [Users]
      summary: Create new user
      description: Requires CAN_MANAGE_USERS permission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateDTO'
      responses:
        '201':
          description: Created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'

  /users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID
      description: Requires CAN_MANAGE_USERS permission
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Requested user 
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'

    patch:
      tags: [Users]
      summary: Update user
      description: Requires CAN_MANAGE_USERS permission
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateDTO'
      responses:
        '200':
          description: Updated user

    delete:
      tags: [Users]
      summary: Delete user
      description: Requires CAN_MANAGE_USERS permission
      parameters:
         - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: User deleted

  # Assigning or changing role for the user
  /users/{id}/roles:
    get:
      tags: [Users]
      summary: Get roles of a user
      parameters:
          - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Roles of user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleDTO'

    post:
      tags: [Users]
      summary: Assign role to user
      parameters:
          - $ref: '#/components/parameters/UserId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleDTO'
      responses:
        '200':
          description: Role assigned

  /users/{id}/roles/{roleId}:
    delete:
      tags: [Users]
      summary: Remove role from user
      parameters:
          - $ref: '#/components/parameters/UserId'
          - $ref: '#/components/parameters/RoleId'
      responses:
        '204':
          description: Role removed

  # ROLE MANAGEMENT
  /roles:
    get:
      tags: [Roles]
      summary: Get all roles
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleDTO'

    patch:
      tags: [Roles]
      summary: Update role
      parameters:
        - $ref: '#/components/parameters/RoleId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdateDTO'
      responses:
        '200':
          description: Role updated

  /rooms:
    get:
      summary: Get all rooms
      parameters:
        - name: departmentId
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomDTO'

    post:
      summary: Create room
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomDTO'
      responses:
        '201':
          description: Room created

  /rooms/{id}:
    get:
      summary: Get room by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomDTO'

  /rooms/{id}/climate-stats:
    get:
      summary: Get climate stats for room
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Climate stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClimateStatsDTO'

  /warnings:
    get:
      summary: Get warnings
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: roomId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of warnings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WarningDTO'

  /notifications:
    get:
      summary: Get notifications
      responses:
        '200':
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationDTO'

  /limits:
    get:
      summary: Get all limits
      responses:
        '200':
          description: Limits list

    patch:
      summary: Update limits
      responses:
        '200':
          description: Limits updated

  /absences:

    get:
      tags: [Absences]
      summary: List absences (Context-Aware)
      description: |
        Returns absences based on the requester's role:
        - **Worker**: Returns only their own absences (same as /users/me/absences).
        - **Manager**: Returns all absences for users within their assigned department.
        - **Admin**: Returns all absences in the system.
      parameters:
        - name: departmentId
          in: query
          description: Optional filter for Managers/Admins to view a specific department.
          schema:
            type: string
      responses:
        '200':
          description: A list of absences the user is authorized to see.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AbsenceDTO'

    post:
      tags: [Absences]
      summary: Create a new absence
      description: Workers create for themselves; Managers/Admins can create for others.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbsenceCreateDTO'
      responses:
        '201':
          description: Absence created successfully.

  /absences/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Absences]
      summary: Get details of a specific absence
      responses:
        '200':
          description: Details of a specific absence returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbsenceDTO'
    patch:
      tags: [Absences]
      summary: Update an absence record
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbsenceUpdateDTO'
      responses:
        '200':
          description: Updated
    delete:
      tags: [Absences]
      summary: Delete an absence
      responses:
        '204':
          description: Deleted

  /users/me/absences:
    get:
      tags: [Absences, Users]
      summary: Get absences for the logged-in user
      description: Handy shortcut for the "My Profile" or "My Absences" view.
      responses:
        '200':
          description: List of the current user's absences.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AbsenceDTO'

components:

  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string

    RoleId:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:

    PermissionEnum:
      type: string
      description: "All possible permission constants"
      enum:
        - CAN_VIEW_OWN_OFFICE_CLIMATE
        - CAN_VIEW_OWN_SHARED_CLIMATE
        - CAN_MANAGE_OWN_ABSENCE
        - CAN_VIEW_OWN_DEPARTMENT_MEASURES
        - CAN_VIEW_OWN_DEPARTMENT_LIMITS_VIOLATION
        - CAN_VIEW_ABSENCE_VIEW
        - CAN_VIEW_COMPANY_AGGR
        - CAN_VIEW_VIOLATIONS_PER_DEPARTMENT
        - CAN_CHANGE_LIMITS
        - CAN_MANAGE_TIPS
        - CAN_VIEW_ALL_ROOMS
        - CAN_MANAGE_USERS
        - CAN_MANAGE_BUILDING_STRUCTURE
        - CAN_MANAGE_DEVICES

    # what the server gives as a list back
    UserDTO:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleDTO'

    # what Frontend sends for creating of an entity
    UserCreateDTO:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    UserUpdateDTO:
      type: object
      properties:
        username:
          type: string

    RoleDTO:
      type: object
      required: [id, name]
      properties:
        id: 
          type: string
          format: uuid
          description: "Unique identifier from the Entity"
        name: 
          type: string
        permissions: 
          type: array
          description: "List of permission strings assigned to this role"
          items: 
            type: string
            enum: 
              - CAN_VIEW_OWN_OFFICE_CLIMATE
              - CAN_VIEW_OWN_SHARED_CLIMATE
              - CAN_MANAGE_OWN_ABSENCE
              - CAN_VIEW_OWN_DEPARTMENT_MEASURES
              - CAN_VIEW_OWN_DEPARTMENT_LIMITS_VIOLATION
              - CAN_VIEW_ABSENCE_VIEW
              - CAN_VIEW_COMPANY_AGGR
              - CAN_VIEW_VIOLATIONS_PER_DEPARTMENT
              - CAN_CHANGE_LIMITS
              - CAN_MANAGE_TIPS
              - CAN_VIEW_ALL_ROOMS
              - CAN_MANAGE_USERS
              - CAN_MANAGE_BUILDING_STRUCTURE
              - CAN_MANAGE_DEVICES

    RoleUpdateDTO:
      type: object
      description: "Fields for updating an existing role. ID is excluded as it is in the path."
      properties:
        name: 
          type: string
        permissions: 
          type: array
          description: "List of permission strings assigned to this role"
          items: 
            type: string
            enum: 
              - CAN_VIEW_OWN_OFFICE_CLIMATE
              - CAN_VIEW_OWN_SHARED_CLIMATE
              - CAN_MANAGE_OWN_ABSENCE
              - CAN_VIEW_OWN_DEPARTMENT_MEASURES
              - CAN_VIEW_OWN_DEPARTMENT_LIMITS_VIOLATION
              - CAN_VIEW_ABSENCE_VIEW
              - CAN_VIEW_COMPANY_AGGR
              - CAN_VIEW_VIOLATIONS_PER_DEPARTMENT
              - CAN_CHANGE_LIMITS
              - CAN_MANAGE_TIPS
              - CAN_VIEW_ALL_ROOMS
              - CAN_MANAGE_USERS
              - CAN_MANAGE_BUILDING_STRUCTURE
              - CAN_MANAGE_DEVICES

    AssignRoleDTO:
      type: object
      properties:
        roleId:
          type: string

    PermissionUpdateDTO:
      type: object
      properties:
        permissions:
          type: array
          items:
            type: string

    SinglePermissionDTO:
      type: object
      properties:
        permission:
          type: string

    RoomDTO:
      type: object
      properties:
        id:
          type: string
        roomType:
          type: string
        defaultPeopleCnt:
          type: integer

    ClimateStatsDTO:
      type: object
      properties:
        tempVal:
          type: integer
        humVal:
          type: integer
        pollVal:
          type: integer
        date:
          type: string

    WarningDTO:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        status:
          type: string

    NotificationDTO:
      type: object
      properties:
        id:
          type: string
        msg:
          type: string

    LoginDTO:
      type: object
      properties:
        username:
          type: string
        password:
          type: string

    AbsenceDTO:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        userName:
          type: string
          description: "Full name or username to display in the Manager's list"
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        reason:
          type: string
          enum: [VACATION, SICK, BUSINESS_TRIP, OTHER]
        status:
          type: string
          enum: [PLANNED, ACTIVE, COMPLETED]

    AbsenceCreateDTO:
      type: object
      required: [userId, startTime, endTime, reason]
      properties:
        userId:
          type: string
          description: "The user ID this absence belongs to"
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        reason:
          type: string
          enum: [VACATION, SICK, BUSINESS_TRIP, OTHER]

    AbsenceUpdateDTO:
      type: object
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        reason:
          type: string
          enum: [VACATION, SICK, BUSINESS_TRIP, OTHER]

