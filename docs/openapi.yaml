openapi: 3.1.0
info:
  title: SWE Skeleton API
  description: This is the API documentation for the SWE Skeleton project.
  contact:
    name: SWE Skeleton Team
  version: "0.1"
servers:
  - url: http://localhost:8080
    description: Development
tags:
  - name: Absences
    description: User absences management
  - name: Building Trend
    description: Calculating building trend
paths:
  /api/warnings:
    post:
      tags:
        - Warnings
      summary: "Create new warning. One of Permissions Required: CAN_SEND_WARNINGS"
      operationId: createWarning
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarningCreateDTO"
        required: true
      responses:
        "201":
          description: Created warning with tip.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WarningDTO"
        "400":
          description: Validation issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Unauthorized.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WarningDTO"
  /api/users:
    get:
      tags:
        - User management
      summary: "Get Page of Users. One of Permissions Required: CAN_MANAGE_USERS"
      operationId: getPageOfUsers
      parameters:
        - name: pageable
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Page of users.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageUserxDTO"
        "401":
          description: Unauthorized.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageUserxDTO"
    post:
      tags:
        - User management
      summary: "Create new User. One of Permissions Required: CAN_MANAGE_USERS"
      operationId: createNewUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserxCreateDTO"
        required: true
      responses:
        "201":
          description: Created user.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserxDTO"
        "400":
          description: Validation issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Username conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Unauthorized.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserxDTO"
  /api/tips:
    get:
      tags:
        - Tip Management
      summary: "Get all tips. One of Permissions Required: CAN_MANAGE_TIPS"
      operationId: getAllTips
      responses:
        "200":
          description: List of tips.
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TipDTO"
        "401":
          description: Unauthorized.
    post:
      tags:
        - Tip Management
      summary: "Create new tip. One of Permissions Required: CAN_MANAGE_TIPS"
      operationId: createNewTip
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TipCreateDTO"
        required: true
      responses:
        "201":
          description: Created new tip.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TipDTO"
        "400":
          description: Validation issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Tip for one of types/statuses/sensors conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Unauthorized.
  /api/sensor-stations:
    get:
      tags:
        - Sensor Station Management
      summary: "Get page of sensors. One of Permissions Required: CAN_MANAGE_DEVICES"
      operationId: getAllSensorStations
      parameters:
        - name: pageable
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Page of sensors.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageSensorStationDTO"
        "401":
          description: Unauthorized.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageSensorStationDTO"
    post:
      tags:
        - Sensor Station Management
      summary: "Create new sensor station. One of Permissions Required: CAN_MANAGE_DEVICES"
      operationId: createNewSensorStation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SensorStationCreateDTO"
        required: true
      responses:
        "201":
          description: Created sensor.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SensorStationDTO"
        "400":
          description: Validation issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Name conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Unauthorized.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SensorStationDTO"
  /api/sensor-stations/{sensor_id}/retry-connection:
    post:
      tags:
        - Sensor Station Management
      summary: "Send retry command to raspberry. One of Permissions Required: CAN_MANAGE_DEVICES"
      operationId: retrySensorStation
      parameters:
        - name: sensor_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Sent request.
        "404":
          description: Sensor station not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Unauthorized.
  /api/rooms:
    get:
      tags:
        - Room management
      summary: "Get page of rooms. One of Permissions Required: CAN_MANAGE_BUILDING_STRUCTURE"
      operationId: getPageOfRooms
      parameters:
        - name: pageable
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Page of rooms.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageRoomDTO"
        "401":
          description: Unauthorized.
    post:
      tags:
        - Room management
      summary: "Create new room. One of Permissions Required: CAN_MANAGE_BUILDING_STRUCTURE"
      operationId: createNewRoom
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomCreateDTO"
        required: true
      responses:
        "201":
          description: Created room.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoomDTO"
        "400":
          description: Validation issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Department not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Room naming conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Unauthorized.
  /api/raspberry-pis:
    get:
      tags:
        - Raspberry Pi Management
      summary: "Get page of Raspberries. One of Permissions Required: CAN_MANAGE_DEVICES"
      operationId: getAllRaspberries
      parameters:
        - name: pageable
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Page of raspberries.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageRaspberryDTO"
        "401":
          description: Unauthorized.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageRaspberryDTO"
    post:
      tags:
        - Raspberry Pi Management
      summary: "Create new Raspberry Pi. One of Permissions Required: CAN_MANAGE_DEVICES"
      operationId: createNewRaspberry
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RaspberryCreateDTO"
        required: true
      responses:
        "201":
          description: Created raspberry.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RaspberryDTO"
        "400":
          description: Validation issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Name/Ip/Port conflicts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Unauthorized.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RaspberryDTO"
  /api/raspberry-pis/{raspberry_id}/rooms/{room_id}:
    post:
      tags:
        - Raspberry Pi Management
      summary: "Add room to Raspberry Pi. One of Permissions Required: CAN_MANAGE_DEVICES"
      operationId: addTheRoomToRaspberry
      parameters:
        - name: raspberry_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: room_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Successfully added new Room.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RaspberryDTO"
        "404":
          description: Raspberry Pi/Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Room already assigned to other Raspberry..
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Unauthorized.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RaspberryDTO"
    delete:
      tags:
        - Raspberry Pi Management
      summary: "Remove Room from Raspberry Pi. One of Permissions Required: CAN_MANAGE_DEVICES"
      operationId: removeTheRoomFromRaspberry
      parameters:
        - name: raspberry_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: room_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Successfully removed Room.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RaspberryDTO"
        "404":
          description: Raspberry Pi/Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Unauthorized.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RaspberryDTO"
  /api/raspberry-pis/{raspberry_id}/retry-connection:
    post:
      tags:
        - Raspberry Pi Management
      summary: "Send retry command to raspberry. One of Permissions Required: CAN_MANAGE_DEVICES"
      operationId: retryDevicesConnection
      parameters:
        - name: raspberry_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Sent request.
        "404":
          description: Raspberry not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Unauthorized.
  /api/measurements:
    post:
      tags:
        - Climate Endpoints
      summary: "Post measurement. One of Permissions Required: CAN_SEND_MEASUREMENTS"
      operationId: postMeasurements
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeasurementBatchDTO"
        required: true
      responses:
        "201":
          description: Created measurement.
        "400":
          description: Validation issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Unauthorized.
  /api/login:
    post:
      tags:
        - Auth
      summary: Log in
      operationId: authenticateUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequestDTO"
        required: true
      responses:
        "200":
          description: Bearer Token.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginResponseDTO"
        "400":
          description: Validation issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Unauthorized.
  /api/departments:
    get:
      tags:
        - Department Management
      summary: "Get page of departments. One of Permissions Required: CAN_VIEW_ALL_BUILDINGS, CAN_MANAGE_BUILDING_STRUCTURE, CAN_VIEW_COMPANY_AGGR"
      operationId: getPageOfDepartments
      parameters:
        - name: pageable
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Page of departments.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageDepartmentListDTO"
        "401":
          description: Unauthorized.
    post:
      tags:
        - Department Management
      summary: "Create new department. One of Permissions Required: CAN_MANAGE_BUILDING_STRUCTURE"
      operationId: createNewDepartment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentWithRoomsCreateDTO"
        required: true
      responses:
        "201":
          description: Created new department.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DepartmentDTO"
        "400":
          description: Validation issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Name inside of a building is duplicate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Unauthorized.
  /api/buildings:
    get:
      tags:
        - Building Management
      summary: "Get page of buildings. Permissions Required: CAN_VIEW_ALL_BUILDINGS, CAN_MANAGE_BUILDING_STRUCTURE"
      operationId: getPageOfBuildings
      parameters:
        - name: pageable
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Page of buildings.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageBuildingListDTO"
        "401":
          description: Unauthorized.
    post:
      tags:
        - Building Management
      summary: "Create new building. Permissions Required: CAN_MANAGE_BUILDING_STRUCTURE"
      operationId: createNewBuilding
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildingCreateDTO"
        required: true
      responses:
        "201":
          description: Created Building.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BuildingDTO"
        "400":
          description: Validation issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Either name or address is duplicate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Unauthorized.
  /api/absences:
    get:
      tags:
        - Absences
      summary: "Get all absences. One of Permissions Required: CAN_MANAGE_OWN_ABSENCE, CAN_VIEW_ABSENCE_VIEW"
      operationId: getAllAbsences
      parameters:
        - name: pageable
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: List of Absences. For department management it'll return a list of all employees of department. For employee only his own.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageAbsenceListDTO"
        "403":
          description: Unauthorized.
    post:
      tags:
        - Absences
      summary: "Create new absence. One of Permissions Required: CAN_MANAGE_OWN_ABSENCE"
      operationId: createNewAbsence
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbsenceCreateDTO"
        required: true
      responses:
        "201":
          description: Created absence.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AbsenceDTO"
        "400":
          description: Validation issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Manager not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/absences/clock-in:
    post:
      tags:
        - Absences
      summary: Clock-in
      operationId: clockInForSpecificRoom
      responses:
        "200":
          description: OK
        "409":
          description: Clock-in twice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Unauthorized.
  /api/warnings/{warning_id}/resolve:
    patch:
      tags:
        - Warnings
      summary: "Resolve existing warnings. One of Permissions Required: CAN_SEND_WARNINGS"
      operationId: resolveWarning
      parameters:
        - name: warning_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Resolved warning.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WarningDTO"
        "400":
          description: Validation issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Unauthorized.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WarningDTO"
  /api/users/{user_id}:
    get:
      tags:
        - User management
      summary: "Get specific user. One of Permissions Required: CAN_MANAGE_USERS"
      operationId: getSpecificUser
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserxDTO"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Unauthorized.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserxDTO"
    delete:
      tags:
        - User management
      summary: "Patch specific User. One of Permissions Required: CAN_MANAGE_USERS"
      operationId: deleteSpecificUser
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: User deleted.
        "401":
          description: Unauthorized.
    patch:
      tags:
        - User management
      summary: "Patch specific User. One of Permissions Required: CAN_MANAGE_USERS"
      operationId: patchSpecificUser
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserxPatchDTO"
        required: true
      responses:
        "200":
          description: Patched user.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserxDTO"
        "400":
          description: Validation issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Username conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Unauthorized.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserxDTO"
  /api/users/settings:
    get:
      tags:
        - User management
      summary: Get settings of a user.
      operationId: getUserSettings
      responses:
        "200":
          description: User settings.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserSettingsDTO"
        "404":
          description: User settings not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Unauthorized.
    patch:
      tags:
        - User management
      summary: Patch settings of a user.
      operationId: updateUserSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSettingsPatchDTO"
        required: true
      responses:
        "200":
          description: Patched User settings.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserSettingsDTO"
        "404":
          description: User settings not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Unauthorized.
  /api/tips/{tip_id}:
    delete:
      tags:
        - Tip Management
      summary: "Delete specific tip. One of Permissions Required: CAN_MANAGE_TIPS"
      operationId: deleteSpecificTip
      parameters:
        - name: tip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted.
        "401":
          description: Unauthorized.
    patch:
      tags:
        - Tip Management
      summary: "Update specific tip. One of Permissions Required: CAN_MANAGE_TIPS"
      operationId: patchMessageForTip
      parameters:
        - name: tip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TipPatchDTO"
        required: true
      responses:
        "200":
          description: Updated tip.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TipDTO"
        "400":
          description: Validation issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Tip not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Unauthorized.
  /api/sensor-stations/{sensor_id}:
    get:
      tags:
        - Sensor Station Management
      summary: "Get specific sensor. One of Permissions Required: CAN_MANAGE_DEVICES"
      operationId: getSpecificSensorById
      parameters:
        - name: sensor_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Specific sensor station.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SensorStationDTO"
        "404":
          description: Sensor not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Unauthorized.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SensorStationDTO"
    delete:
      tags:
        - Sensor Station Management
      summary: "Delete sensor. One of Permissions Required: CAN_MANAGE_DEVICES"
      operationId: removeSpecificSensor
      parameters:
        - name: sensor_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted sensor station.
        "404":
          description: Sensor not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
