openapi: 3.0.0
info:
  title: ClimateCanary API
  version: 1.0.0
  description: API for out climate monitoring project with RBAC

tags:
  - name: Users
    description: User management
  - name: Roles
    description: Role and permission management
  - name: Absences
    description: Absence management (vacation, illness, etc.)
  - name: Building Structure
    description: Managment of the buildings, departments and rooms
  - name: Raspberry Pi
    description: Raspberry Pi device management for the system admin
  - name: Sensor Station
    description: Sensor Station/Arduino management for the system admin
  - name: Limit Management
    description: Setting limit values per room
  - name: Climate Data
    description: Operations related to sensor readings, historical diagrams, and building-wide climate status.
paths:

  # Sensor Station end-points
  /sensor-stations:
    get:
      tags: [Sensor Station]
      summary: List all Arduino sensor stations
      parameters:
        - name: piId
          in: query
          description: Filter by the Raspberry Pi they report to
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: List of sensor stations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SensorStationDTO' }
    post:
      tags: [Sensor Station]
      summary: Register a new Arduino station
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SensorStationCreateDTO' }
      responses:
        '201':
          description: Created

  /sensor-stations/{id}:
    patch:
      tags: [Sensor Station]
      summary: Update station details (e.g., move to a different Pi)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SensorStationCreateDTO' }
      responses:
        '200':
          description: Updated
    get:
      tags: [Sensor Station]
      summary: Get details of a specific Arduino
      description: Returns hardware details and connection status.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SensorStationDTO' }
        '404':
          description: Sensor Station not found.

    delete:
      tags: [Sensor Station]
      summary: Remove an Arduino from the system
      description: >
        Deletes the device from the DB. 
        CRITICAL: The Webapp must then send a NOTIFY (updateType: SENSORS) 
        to the parent Raspberry Pi so it clears its BLE whitelist.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Successfully deleted.
        '404':
          description: Sensor Station not found.

  /auth/login:
    post:
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDTO'
      responses:
        '200':
          description: Successful login
        '401':
          description: Unauthorized

  /auth/logout:
    post:
      summary: Logout user
      responses:
        '200':
          description: Successful logout
        '401':
          description: Unauthorized

  # CLIMATE DATA
  /measurements:
    post:
      tags: [Climate Data]
      summary: Raspberry Pi pushes new sensor data
      description: "Hardware-facing endpoint. The Pi sends a batch of readings for a room every {frequency} seconds."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeasurementCreateDTO' }
      responses:
        '201':
          description: Measurements successfully stored
        '400':
          description: Invalid data format

  /rooms/{id}/current-climate:
    get:
      tags: [Climate Data]
      summary: Get the latest reading for a specific room
      description: "Used for Dashboard cards to show the most recent Temp, Humidity, and CO2.
            Needs CAN_VIEW_OWN_OFFICE_CLIMATE permission." 
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Latest data point retrieved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClimateDataPointDTO' }

  /rooms/{id}/overtime:
    get:
      tags: [Climate Data]
      summary: Get raw climate data with precise date and time window filtering
      description: >
        Returns measurements from ClimateStats. 
        Example: Fetch data from 04:00 to 08:00 for the period between 23.03 and 26.03.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: startDate
          in: query
          required: true
          description: "The starting day of the range (e.g., 2026-03-23)"
          schema: { type: string, format: date }
        - name: endDate
          in: query
          required: true
          description: "The ending day of the range (e.g., 2026-03-26)"
          schema: { type: string, format: date }
        - name: startTime
          in: query
          required: false
          description: "Filter for a specific time of day start (e.g., 04:00:00)"
          schema: { type: string, example: "04:00:00" }
        - name: endTime
          in: query
          required: false
          description: "Filter for a specific time of day end (e.g., 08:00:00)"
          schema: { type: string, example: "08:00:00" }
      responses:
        '200':
          description: List of filtered raw data points
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ClimateDataPointDTO' }

  /rooms/{id}/climate-history:
    get:
      tags: [Climate Data]
      summary: Get aggregated data for historical analysis
      description: "Returns averaged data from AggregatedStats to reduce DB load for Day/Week/Month views."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: timeframe
          in: query
          required: true
          schema: { type: string, enum: [MONTH, WEEK, DAY] }
        - name: granularity
          description: Aggregation level
          in: query
          schema: { type: string, enum: [HOUR, DAY] }
      responses:
        '200':
          description: List of aggregated data points
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ClimateDataPointDTO' }

  /rooms/{id}/violations:
    get:
      tags: [Climate Data]
      summary: Get historical violation log for a room
      description: "Returns the table of limit breaches seen below the charts in the UI.
        Needs CAN_VIEW_OWN_OFFICE_CLIMATE permission."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: List of past warnings/violations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ViolationLogDTO' }

  /departments/{id}/summary:
    get:
      tags: [Climate Data]
      summary: Get climate overview for a whole department
      description: "Used for the 'Department Overview' screen to show averages and status colors.
        Needs CAN_VIEW_DEPARTMENT_CLIMATE permission."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Department-wide climate summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentClimateSummaryDTO' }

  /buildings/global-status:
    get:
      tags: [Climate Data]
      summary: Get status of the entire building. 
      description: "Populates the landing page charts showing counts of Good vs. Critical rooms.
       CAN_VIEW_COMPANY_AGGR required."
      responses:
        '200':
          description: Global building health stats
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuildingGlobalStatusDTO' }

  /warnings:
    get:
      tags: [Climate Data]
      summary: Get all active climate warnings
      description: "Used for the global notification bell or dashboard alert list."
      responses:
        '200':
          description: List of current active warnings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WarningCreateDTO' }
    post:
      tags: [Climate Data]
      summary: Raspberry Pi reports a limit violation
      description: "Hardware-facing endpoint. Triggered instantly when a sensor crosses a threshold."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarningCreateDTO' }
      responses:
        '201':
          description: Warning recorded and notification triggered

  # TIPS MANAGEMENT
  /rooms/{id}/tips:
    get:
      tags: [Climate Data]
      summary: Get all tips for a specific room. 
      description: "Returns the tips for the 'Tips' section in the Room Analysis view."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: List of tips retrieved
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TipDTO' }
    post:
      tags: [Climate Data]
      summary: Create a new tip for a room
      description: "Triggered when 'Save Limits & Tips' is clicked. CAN_MANAGE_TIPS required"
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TipCreateDTO' }
      responses:
        '201':
          description: Tip created

  /tips/{tipId}:
    delete:
      tags: [Climate Data]
      summary: Delete a specific tip. 
      description: CAN_MANAGE_TIPS required
      parameters:
        - name: tipId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Tip deleted

  # LIMIT MANAGEMENT
  /rooms/{id}/limits:
    get:
      tags: [Limit Management]
      summary: Get climate limits for a specific room
      description: "Returns the configuration seen in the 'Limit Settings' UI for a single room. CAN_MANAGE_TIPS required."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Room limits successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitsDTO'

    patch:
      tags: [Limit Management]
      summary: Update climate limits for a room
      description: "Triggered when the Admin clicks 'Save' in the Limit Settings view. CAN_MANAGE_TIPS required."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LimitsDTO'
      responses:
        '200':
          description: Room limits updated

  # Special endpoint for the Raspberry Pi
  /raspberry-pis/{id}/sync/occupancy:
    get:
      tags: [Raspberry Pi]
      summary: Pi fetches current room occupancy and privacy status
      description: >
        Hardware-facing sync endpoint. Called by the Pi after receiving an 
        ABSENCE updates. The Pi uses this to decide whether to 
        suspend data transmission (Privacy Mode) based on the 5-person rule.
      parameters:
        - name: id
          in: path
          required: true
          description: The UUID of the Raspberry Pi
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: "Occupancy data successfully retrieved."
          content:
            application/json:
              schema:
                type: object
                properties:
                  effectiveOccupancy: 
                    type: integer
                    example: 4
                  privacyModeActive: 
                    type: boolean
                    example: true
        '404':
          description: Raspberry Pi ID not found.

  /raspberry-pis/{piId}/sync/limits:
    get:
      tags: [Limit Management]
      summary: Raspberry Pi fetches limits for all its assigned rooms
      description: "The Pi calls this to get a list of limits for every room it is monitoring."
      parameters:
        - name: piId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A list of room limits for the Pi to store locally
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LimitsDTO'

  # RASPBERRY PI MANAGEMENT
  /raspberry-pis:
    get:
      tags: [Raspberry Pi]
      summary: List all Raspberry Pis
      description: CAN_MANAGE_DEVICES permission required.
      parameters:
        - name: roomId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: "Filter Raspberry Pi devices by a specific room"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, SLEEP, OFFLINE]
          description: "Filter Raspberry Pi devices by their current status"
      responses:
        '200':
          description: A filtered list of Raspberry Pi devices
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RaspberryDTO' }
    post:
      tags: [Raspberry Pi]
      summary: Add a new Raspberry Pi device (Add Device button in UI)
      description: CAN_MANAGE_DEVICES permission required.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RaspberryCreateDTO' }
      responses:
        '201':
          description: Device successfully registered

  /raspberry-pis/{id}:
    get:
      tags: [Raspberry Pi]
      summary: Get details for a specific Raspberry Pi device
      description: CAN_MANAGE_DEVICES permission required.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Device details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RaspberryDTO' }
    
    patch:
      tags: [Raspberry Pi]
      summary: Update Raspberry Pi device configuration 
      description: CAN_MANAGE_DEVICES permission required.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RaspberryCreateDTO' }
      responses:
        '200':
          description: Raspberry Pi updated

    delete:
      tags: [Raspberry Pi]
      summary: Remove Raspberry Pi
      description: CAN_MANAGE_DEVICES permission required.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Raspberry Pi deleted
  
  /raspberry-pis/{id}/config:
    get:
      tags: [Raspberry Pi]
      summary: Fetch Raspberry Pi operational configuration
      description: "Called by the Pi to get its heartbeat frequency and its list of child sensors."
      parameters:
        - name: id
          in: path
          required: true
          description: "The UUID of the Raspberry Pi itself"
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Configuration successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PiConfigDTO'

  # BUILDING STRUCTURE MANAGEMENT
  /buildings:
    get:
      tags: [Building Structure]
      summary: Get all buildings
      description: CAN_MANAGE_BUILDING_STRUCTURE permission required.
      responses:
        '200':
          description: List of buildings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BuildingDTO' }
    post:
      tags: [Building Structure]
      summary: Add a new building
      description: CAN_MANAGE_BUILDING_STRUCTURE permission required.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BuildingCreateDTO' }
      responses:
        '201':
          description: Building created
  
  /buildings/{id}:
    patch:
      tags: [Building Structure]
      summary: Update building details
      description: CAN_MANAGE_BUILDING_STRUCTURE permission required.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BuildingCreateDTO' }
      responses:
        '200':
          description: Building updated
    delete:
      tags: [Building Structure]
      summary: Delete a building
      description: CAN_MANAGE_BUILDING_STRUCTURE permission required.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Building deleted

  /departments:
    get:
      tags: [Building Structure]
      summary: Get all departments for the table view
      description: CAN_MANAGE_BUILDING_STRUCTURE permission required.
      responses:
        '200':
          description: Returns departments with building names and room lists
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DepartmentDTO' }
    post:
      tags: [Building Structure]
      summary: Create a new department
      description: CAN_MANAGE_BUILDING_STRUCTURE permission required.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartmentCreateDTO' }
      responses:
        '201':
          description: Department created

  /departments/{id}:
    patch:
      tags: [Building Structure]
      summary: Update department details
      description: CAN_MANAGE_BUILDING_STRUCTURE permission required.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartmentCreateDTO' }
      responses:
        '200':
          description: Department updated
    delete:
      tags: [Building Structure]
      summary: Remove a department 
      description: CAN_MANAGE_BUILDING_STRUCTURE permission required.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Department deleted

  /rooms:
    get:
      tags: [Building Structure]
      summary: Get all rooms
      description: CAN_MANAGE_BUILDING_STRUCTURE permission required.
      responses:
        '200':
          description: List of rooms
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoomDTO' }
    post:
      tags: [Building Structure]
      summary: Create a new room
      description: CAN_MANAGE_BUILDING_STRUCTURE permission required.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoomCreateDTO' }
      responses:
        '201':
          description: Room created

  /rooms/{id}:
    patch:
      tags: [Building Structure]
      summary: Update room details 
      description: CAN_MANAGE_BUILDING_STRUCTURE permission required.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoomCreateDTO' }
      responses:
        '200':
          description: Room updated
    delete:
      tags: [Building Structure]
      summary: Delete a room
      description: CAN_MANAGE_BUILDING_STRUCTURE permission required.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Room deleted

  #USER MANAGEMENT
  /users:
    get:
      tags: [Users]
      summary: Get all users
      description: Requires CAN_MANAGE_USERS permission
      responses:
        '200':
          description: List of all users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDTO'
        '401':
          description: Unauthorized

    post:
      tags: [Users]
      summary: Create new user
      description: Requires CAN_MANAGE_USERS permission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateDTO'
      responses:
        '201':
          description: Created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'

  /users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID
      description: Requires CAN_MANAGE_USERS permission
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Requested user 
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'

    patch:
      tags: [Users]
      summary: Update user
      description: Requires CAN_MANAGE_USERS permission
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateDTO'
      responses:
        '200':
          description: Updated user

    delete:
      tags: [Users]
      summary: Delete user
      description: Requires CAN_MANAGE_USERS permission
      parameters:
         - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: User deleted

  # ROLE MANAGEMENT
  /roles:
    get:
      tags: [Roles]
      summary: Get all roles
      description: Requires CAN_MANAGE_USERS permission
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleDTO'

    patch:
      tags: [Roles]
      summary: Update role
      description: Requires CAN_MANAGE_USERS permission
      parameters:
        - $ref: '#/components/parameters/RoleId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdateDTO'
      responses:
        '200':
          description: Role updated

  # ABSENCES MANAGEMENT
  /absences:

    get:
      tags: [Absences]
      summary: List absences 
      description: |
        Returns absences based on the requester's role:
        - **Worker**: Returns only their own absences (same as /users/me/absences).
        - **Manager**: Returns all absences for users within their assigned department.
      parameters:
        - name: departmentId
          in: query
          description: Optional filter for Managers to view a specific department.
          schema:
            type: string
      responses:
        '200':
          description: A list of absences the user is authorized to see.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AbsenceDTO'

    post:
      tags: [Absences]
      summary: Create a new absence
      description: Workers create for themselves. CAN_MANAGE_OWN_ABSENCE permission required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbsenceCreateDTO'
      responses:
        '201':
          description: Absence created successfully.

  /absences/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Absences]
      summary: Get details of a specific absence. CAN_MANAGE_ABSENCES permission required.
      responses:
        '200':
          description: Details of a specific absence returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbsenceDTO'
    patch:
      tags: [Absences]
      summary: Approve or reject an absence. CAN_APPROVE_ABSENCES permission required.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbsenceUpdateDTO'
      responses:
        '200':
          description: Updated

    delete:
      tags: [Absences]
      summary: Delete an absence
      description: CAN_MANAGE_OWN_ABSENCE permission required.
      responses:
        '204':
          description: Deleted

  /users/me/absences:
    get:
      tags: [Absences, Users]
      summary: Get absences for the logged-in user
      description: A shortcut for the "My Absences" view. CAN_MANAGE_OWN_ABSENCE permission required.
      responses:
        '200':
          description: List of the current user's absences.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AbsenceDTO'

components:

  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    RoleId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:

    PermissionEnum:
      type: string
      description: "All possible permission constants"
      enum:
        - CAN_VIEW_OWN_OFFICE_CLIMATE
        - CAN_VIEW_OWN_SHARED_CLIMATE
        - CAN_MANAGE_OWN_ABSENCE
        - CAN_VIEW_OWN_DEPARTMENT_MEASURES
        - CAN_VIEW_OWN_DEPARTMENT_LIMITS_VIOLATION
        - CAN_VIEW_ABSENCE_VIEW
        - CAN_VIEW_COMPANY_AGGR
        - CAN_VIEW_VIOLATIONS_PER_DEPARTMENT
        - CAN_CHANGE_LIMITS
        - CAN_MANAGE_TIPS
        - CAN_VIEW_ALL_ROOMS
        - CAN_MANAGE_USERS
        - CAN_MANAGE_BUILDING_STRUCTURE
        - CAN_MANAGE_DEVICES

    UserDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        employeeId:
          type: string
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleDTO'

    # what Frontend sends for creating of an entity
    UserCreateDTO:
      type: object
      required: [username, password, employeeId, secondName]
      properties:
        employeeId:
          type: string
          description: "The unique company employee number"
        username:
          type: string
        password:
          type: string
          format: password
          description: "Plain text password (will be hashed with bcrypt by the server)"
        firstName:
          type: string
        secondName:
          type: string
        roleIds:
          type: array
          items:
            type: string
            format: uuid
          description: "List of Role UUIDs to assign to the new user"

    RoleDTO:
      type: object
      required: [id, name]
      properties:
        id: 
          type: string
          format: uuid
          description: "Unique identifier from the Entity"
        name: 
          type: string
        permissions: 
          type: array
          description: "List of permission strings assigned to this role"
          items: 
            $ref: '#/components/schemas/PermissionEnum'

    RoleUpdateDTO:
      type: object
      description: "Fields for updating an existing role. ID is excluded as it is in the path."
      properties:
        name: 
          type: string
        permissions: 
          type: array
          description: "List of permission strings assigned to this role"
          items: 
            $ref: '#/components/schemas/PermissionEnum'

    LoginDTO:
      type: object
      properties:
        username:
          type: string
        password:
          type: string

    AbsenceDTO:
      type: object
      required: [id, userId, startDate, endDate, typeOfAbsence, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        # Included from User Entity for Frontend convenience
        firstName: 
          type: string
        secondName: 
          type: string
        # Included from Room Entity for Frontend convenience
        room:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        typeOfAbsence:
          type: string
          enum: [ILLNESS, VACATION, OTHER]
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        createdAt:
          type: string
          format: date-time 
          description: "Timestamp when the request was created"

    AbsenceCreateDTO:
      type: object
      required: [startDate, endDate, reasonOfAbsence]
      properties:
        # Maps to the 'Select date' and 'From' / 'Till' fields in the UI:
        startDate:
          type: string
          format: date-time
          description: "Starting date (and optionally time) of the absence."
        endDate:
          type: string
          format: date-time
          description: "Ending date (and optionally time) of the absence."
        # Maps to the 'Reason of absence' dropdown in the UI:
        reasonOfAbsence:
          type: string
          enum: [VACATION, ILLNESS, OTHER] 
        # Maps to the 'Optional message' text box at the bottom of the UI:
        comment:
          type: string
          description: "Optional message or context provided by the requesting user."
        managerId:
          type: string
          format: uuid
          description: "The UUID of the specific manager selected to approve this request"

    AbsenceUpdateDTO:
      type: object
      properties:
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]

    BuildingDTO:
      type: object
      required: [id, name, address]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "HQ" }
        address:
          type: string
          example: "Main Street 5, 6020 Innsbruck"

    DepartmentDTO:
      type: object
      required: [id, name, buildingId]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "IT" }
        buildingId: { type: string, format: uuid }
        buildingName: { type: string, example: "HQ" } 
        roomNumbers: 
          type: array
          items: { type: string }

    RoomDTO:
      type: object
      required: [id, roomNumber, departmentId]
      properties:
        id: { type: string, format: uuid }
        roomNumber: { type: string, example: "101" }
        departmentId: { type: string, format: uuid }
        roomType:
          type: string
          enum: [OFFICE, SHARED]
        defaultPeopleCnt:
          type: integer
          description: "The standard number of people assigned to this room"

    BuildingCreateDTO:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: "Finance Centre West"
        address:
          type: string
          example: "Main Street 5, 6020 Innsbruck"

    DepartmentCreateDTO:
      type: object
      required: [name, buildingId]
      properties:
        name:
          type: string
          example: "HR"
        buildingId:
          type: string
          format: uuid
          description: "The UUID of the building this department belongs to"

    RoomCreateDTO:
      type: object
      required: [roomNumber, departmentId]
      properties:
        roomNumber:
          type: string
          example: "101"
          description: "The human-readable number/name of the room"
        departmentId:
          type: string
          format: uuid
          description: "The UUID of the department this room belongs to"
        roomType:
          type: string
          enum: [OFFICE, SHARED]
        defaultPeopleCnt:
          type: integer
          description: "The standard number of people assigned to this room"

    PiConfigDTO:
      type: object
      required: [frequency, sensors]
      properties:
        frequency:
          type: integer
          example: 60
          description: "How often (seconds) the Pi pushes sensor batches to /measurements"
        sensors:
          type: array
          description: "List of Sensor Stations (Arduinos) this Pi must listen to via BLE"
          items:
            type: object
            properties:
              sensorId:
                type: string
                format: uuid
              name: 
                type: string
                example: "Station_Alpha_01"
              bleHardwareAddress:
                type: string
                example: "D4:36:39:C1:22:AA"
                description: "The MAC address used for BLE pairing/filtering"

    PiOccupancyDTO:
      type: object
      required: [effectiveOccupancy, privacyModeActive]
      properties:
        effectiveOccupancy:
          type: integer
          example: 4
          description: "Total people currently in the room (Default count minus active absences)"
        privacyModeActive:
          type: boolean
          example: true
          description: "If true, the Pi must stop sending climate data (5-person rule)"
        lastUpdated:
          type: string
          format: date-time

    RaspberryDTO:
      type: object
      required: [id, name, status, ipAddress, roomId]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "Pi-Gateway-Room101" }
        ipAddress: 
          type: string
          example: "192.168.1.50"
          description: "The local IP used by the Webapp to send /notify pings"
        status:
          type: string
          enum: [ACTIVE, OFFLINE, MAINTENANCE]
        roomId: { type: string, format: uuid }
        roomNumber: { type: string, example: "101" }

    RaspberryCreateDTO:
      type: object
      required: [name, ipAddress, roomId]
      properties:
        name: { type: string }
        ipAddress: { type: string }
        roomId: { type: string, format: uuid }
    
    LimitsDTO:
      type: object
      required: [roomId]
      properties:
        roomId:
          type: string
          format: uuid
        tempMin: 
          type: number
          format: float
          example: 20.0
        tempMax: 
          type: number
          format: float
          example: 26.0
        humMin: 
          type: number
          format: float
          example: 40.0
        humMax: 
          type: number
          format: float
          example: 60.0
        co2Max: 
          type: integer
          example: 1000
          description: "PPM threshold for Air Quality warnings"

    MeasurementCreateDTO:
      type: object
      required: [roomId, timestamp, readings]
      description: Sent by Pi every {frequency} seconds.
      properties:
        roomId: { type: string, format: uuid }
        timestamp: { type: string, format: date-time }
        readings:
          type: array
          items:
            type: object
            properties:
              type: { type: string, enum: [TEMPERATURE, HUMIDITY, CO2] }
              value: { type: number, example: 22.5 }

    WarningCreateDTO:
      type: object
      required: [roomId, sensorType, value, limitExceeded]
      description: Sent by Pi ONLY when a limit is exceeded
      properties:
        roomId: { type: string, format: uuid }
        sensorType: { type: string, enum: [TEMPERATURE, HUMIDITY, CO2] }
        value: { type: number, example: 1200 }
        limitExceeded: { type: number, example: 1000 }
        message: { type: string, example: "Critical CO2 level in Room 101" }

    ClimateDataPointDTO:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        temperature: { type: number }
        humidity: { type: number }
        co2: { type: integer }
        tempMax: { type: number }
        tempMin: { type: number }

    DepartmentClimateSummaryDTO:
      type: object
      properties:
        departmentId: { type: string, format: uuid }
        avgTemperature: { type: number }
        activeWarnings: { type: integer }
        status: { type: string, enum: [GOOD, WARNING, CRITICAL] }

    # For the "Building Overview" / "Department Trend" charts
    BuildingGlobalStatusDTO:
      type: object
      properties:
        totalRooms: { type: integer }
        roomsGood: { type: integer }    # Green count
        roomsWarning: { type: integer } # Yellow count
        roomsCritical: { type: integer } # Red count
        avgAirQuality: { type: number }
        trend: { type: string, enum: [UP, DOWN, STABLE] }

    # For the "Violation Log" table in the Room Analysis view
    ViolationLogDTO:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        sensorType: { type: string, enum: [TEMPERATURE, HUMIDITY, CO2] }
        value: { type: number }
        limitViolated: { type: number }
        duration: { type: string, example: "15 min" }

    TipDTO:
      type: object
      required: [id, roomId, violationType, violatedSensor, message]
      properties:
        id: { type: string, format: uuid }
        roomId: { type: string, format: uuid }
        violationType:
          type: string
          enum: [OVER, UNDER]
          example: "OVER"
        violatedSensor:
          type: string
          enum: [TEMPERATURE, AIR, HUMIDITY]
          example: "TEMPERATURE"
        message:
          type: string
          example: "Please open windows for 5 minutes."

    TipCreateDTO:
      type: object
      required: [roomId, violationType, violatedSensor, message]
      properties:
        roomId: { type: string, format: uuid }
        violationType:
          type: string
          enum: [OVER, UNDER]
          example: "OVER"
        violatedSensor:
          type: string
          enum: [TEMPERATURE, AIR, HUMIDITY]
          example: "TEMPERATURE"
        message: { type: string }

    SensorStationDTO:
      type: object
      required: [id, name, bleHardwareAddress, status, roomId]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Arduino-Nano-01"
        bleHardwareAddress:
          type: string
          example: "AA:BB:CC:DD:EE:FF"
          description: "The hardcoded MAC address for BLE identification."
        status:
          type: string
          enum: [ACTIVE, OFFLINE]
        roomId:
          type: string
          format: uuid
        connectedToPiId:
          type: string
          format: uuid
          nullable: true
          description: "The UUID of the Raspberry Pi acting as the BLE gateway."

    SensorStationCreateDTO:
      type: object
      required: [name, bleHardwareAddress, roomId]
      properties:
        name: { type: string, example: "Office North Sensor" }
        bleHardwareAddress: { type: string, example: "AA:BB:CC:DD:EE:FF" }
        roomId: { type: string, format: uuid }
        connectedToPiId: { type: string, format: uuid }