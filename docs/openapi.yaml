openapi: 3.0.0
info:
  title: ClimateCanary API
  version: 1.0.0
  description: API for out climate monitoring project with RBAC

tags:
  - name: Users
    description: User management
  - name: Roles
    description: Role and permission management
  - name: Absences
    description: Absence management (vacation, illness, etc.)

paths:

  /auth/login:
    post:
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDTO'
      responses:
        '200':
          description: Successful login
        '401':
          description: Unauthorized

  #USER MANAGEMENT
  /users:
    get:
      tags: [Users]
      summary: Get all users
      description: Requires CAN_MANAGE_USERS permission
      responses:
        '200':
          description: List of all users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDTO'
        '401':
          description: Unauthorized

    post:
      tags: [Users]
      summary: Create new user
      description: Requires CAN_MANAGE_USERS permission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateDTO'
      responses:
        '201':
          description: Created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'

  /users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID
      description: Requires CAN_MANAGE_USERS permission
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Requested user 
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'

    patch:
      tags: [Users]
      summary: Update user
      description: Requires CAN_MANAGE_USERS permission
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateDTO'
      responses:
        '200':
          description: Updated user

    delete:
      tags: [Users]
      summary: Delete user
      description: Requires CAN_MANAGE_USERS permission
      parameters:
         - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: User deleted

  # ROLE MANAGEMENT
  /roles:
    get:
      tags: [Roles]
      summary: Get all roles
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleDTO'

    patch:
      tags: [Roles]
      summary: Update role
      parameters:
        - $ref: '#/components/parameters/RoleId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdateDTO'
      responses:
        '200':
          description: Role updated

  # ABSENCES MANAGEMENT
  /absences:

    get:
      tags: [Absences]
      summary: List absences 
      description: |
        Returns absences based on the requester's role:
        - **Worker**: Returns only their own absences (same as /users/me/absences).
        - **Manager**: Returns all absences for users within their assigned department.
      parameters:
        - name: departmentId
          in: query
          description: Optional filter for Managers to view a specific department.
          schema:
            type: string
      responses:
        '200':
          description: A list of absences the user is authorized to see.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AbsenceDTO'

    post:
      tags: [Absences]
      summary: Create a new absence
      description: Workers create for themselves.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbsenceCreateDTO'
      responses:
        '201':
          description: Absence created successfully.

  /absences/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Absences]
      summary: Get details of a specific absence
      responses:
        '200':
          description: Details of a specific absence returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbsenceDTO'
    patch:
      tags: [Absences]
      summary: Approve or reject an absence
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbsenceUpdateDTO'
      responses:
        '200':
          description: Updated

    delete:
      tags: [Absences]
      summary: Delete an absence
      responses:
        '204':
          description: Deleted

  /users/me/absences:
    get:
      tags: [Absences, Users]
      summary: Get absences for the logged-in user
      description: A shortcut for the "My Absences" view.
      responses:
        '200':
          description: List of the current user's absences.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AbsenceDTO'

components:

  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    RoleId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:

    PermissionEnum:
      type: string
      description: "All possible permission constants"
      enum:
        - CAN_VIEW_OWN_OFFICE_CLIMATE
        - CAN_VIEW_OWN_SHARED_CLIMATE
        - CAN_MANAGE_OWN_ABSENCE
        - CAN_VIEW_OWN_DEPARTMENT_MEASURES
        - CAN_VIEW_OWN_DEPARTMENT_LIMITS_VIOLATION
        - CAN_VIEW_ABSENCE_VIEW
        - CAN_VIEW_COMPANY_AGGR
        - CAN_VIEW_VIOLATIONS_PER_DEPARTMENT
        - CAN_CHANGE_LIMITS
        - CAN_MANAGE_TIPS
        - CAN_VIEW_ALL_ROOMS
        - CAN_MANAGE_USERS
        - CAN_MANAGE_BUILDING_STRUCTURE
        - CAN_MANAGE_DEVICES

    UserDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        employeeId:
          type: string
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleDTO'

    # what Frontend sends for creating of an entity
    UserCreateDTO:
      type: object
      required: [username, password, employeeId, secondName]
      properties:
        employeeId:
          type: string
          description: "The unique company employee number"
        username:
          type: string
        password:
          type: string
          format: password
          description: "Plain text password (will be hashed with bcrypt by the server)"
        firstName:
          type: string
        secondName:
          type: string
        roleIds:
          type: array
          items:
            type: string
            format: uuid
          description: "List of Role UUIDs to assign to the new user"

    RoleDTO:
      type: object
      required: [id, name]
      properties:
        id: 
          type: string
          format: uuid
          description: "Unique identifier from the Entity"
        name: 
          type: string
        permissions: 
          type: array
          description: "List of permission strings assigned to this role"
          items: 
            $ref: '#/components/schemas/PermissionEnum'

    RoleUpdateDTO:
      type: object
      description: "Fields for updating an existing role. ID is excluded as it is in the path."
      properties:
        name: 
          type: string
        permissions: 
          type: array
          description: "List of permission strings assigned to this role"
          items: 
            $ref: '#/components/schemas/PermissionEnum'

    LoginDTO:
      type: object
      properties:
        username:
          type: string
        password:
          type: string

    AbsenceDTO:
      type: object
      required: [id, userId, startDate, endDate, typeOfAbsence, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        # Included from User Entity for Frontend convenience
        firstName: 
          type: string
        secondName: 
          type: string
        # Included from Room Entity for Frontend convenience
        room:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        typeOfAbsence:
          type: string
          enum: [ILLNESS, VACATION, OTHER]
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        createdAt:
          type: string
          format: date-time 
          description: "Timestamp when the request was created"

    AbsenceCreateDTO:
      type: object
      required: [startDate, endDate, reasonOfAbsence]
      properties:
        # Maps to the 'Select date' and 'From' / 'Till' fields in the UI:
        startDate:
          type: string
          format: date-time
          description: "Starting date (and optionally time) of the absence."
        endDate:
          type: string
          format: date-time
          description: "Ending date (and optionally time) of the absence."
        # Maps to the 'Reason of absence' dropdown in the UI:
        reasonOfAbsence:
          type: string
          enum: [VACATION, ILLNESS, OTHER] 
        # Maps to the 'Optional message' text box at the bottom of the UI:
        comment:
          type: string
          description: "Optional message or context provided by the requesting user."
        managerId:
          type: string
          format: uuid
          description: "The UUID of the specific manager selected to approve this request"

    AbsenceUpdateDTO:
      type: object
      properties:
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]

    

