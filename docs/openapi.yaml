      summary: "Get relevant Raspberry Pi Config. One of Permissions Required: CAN_MANAGE_DEVICES"
      operationId: getRaspberryPiConfig
      parameters:
        - name: raspberry_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Config.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PiConfigDTO"
        "404":
          description: Raspberry Pi not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Unauthorized.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PiConfigDTO"
  /api/departments/{id}/last-aggregation:
    get:
      tags:
        - Climate Endpoints
      summary: "Get Department's last aggregation. One of Permissions Required: CAN_VIEW_COMPANY_AGGR"
      operationId: getAggregatedDataForDepartment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Last aggregated data for department.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AggregatedDataPointDTO"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Unauthorized.
  /api/departments/{id}/climate-aggregation:
    get:
      tags:
        - Climate Endpoints
      summary: "Get Department's aggregations. One of Permissions Required: CAN_VIEW_COMPANY_AGGR"
      operationId: getAggregatedDataInPeriodOfTime
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: All of aggregated data for department.
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AggregatedDataPointDTO"
        "400":
          description: Timestamps issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Unauthorized.
  /api/building-trend/departments/{department_id}:
    get:
      tags:
        - Building Trend
      summary: "Trend per department. One of Permissions Required: CAN_VIEW_COMPANY_AGGR"
      operationId: getTrendsForSpecificDepartment
      parameters:
        - name: department_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: List of trends of department
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BuildingTrendDTO"
        "400":
          description: Timestamp issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Unauthorized.
  /api/absences/managers:
    get:
      tags:
        - Absences
      summary: "Get all managers available for absence application. One of Permissions Required: CAN_MANAGE_OWN_ABSENCE"
      operationId: getAvailableManagersForAbsence
      responses:
        "200":
          description: List of available department managers.
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserxListDTO"
        "403":
          description: Unauthorized.
  /api/absences/clock-status:
    get:
      tags:
        - Absences
      summary: Get clock status of authenticated user
      operationId: getClockStatus
      responses:
        "200":
          description: Clock Status of a user.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClockStatusDTO"
        "403":
          description: Unauthorized.
  /api/sensor-stations/{sensor_id}/room:
    delete:
      tags:
        - Sensor Station Management
      summary: "Disconnect sensor from a room. One of Permissions Required: CAN_MANAGE_DEVICES"
      operationId: disconnectSensorFromRoom
      parameters:
        - name: sensor_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Specific sensor station.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SensorStationDTO"
        "404":
          description: Sensor not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Unauthorized.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SensorStationDTO"
  /api/absences/clock-out:
    delete:
      tags:
        - Absences
      summary: Clock-out
      operationId: clockOutForSpecificRoom
      responses:
        "200":
          description: OK
        "409":
          description: Clock-out twice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Unauthorized.
components:
