openapi: 3.0.3

info:
  title: ClimateCanary – Raspberry Pi REST Server API
  description: >
    This API is implemented **on the Raspberry Pi itself**.
    It is a minimal server that the central webapp calls to notify the Pi that
    something has changed. To retrieve new information from Webapp like configurations 
    or new limits it firstly receives lightweight notification pings here, then turns around and
    pulls the actual updated data from the webapp's own API.

    The Pi REST server runs on a configurable port on the Pi's
    local IP address, which is registered in the webapp during device setup.

  version: 1.0.0

tags:
  - name: Notifications
    description: >
      Notifications Pi receives from the Web App about any new changes (config, new limits)
  - name: Health
    description: >
      Used for checking whether Pi is online and 
      operational
  - name: System
    description: >
      Administrative endpoints on the Raspberry Pi for headless management

paths:
  /notify:
    post:
      tags: [Notifications]
      summary: Webapp notifies Pi of a state change
      description: |
        **Triggered by the Webapp.** Upon receiving this notification, the Raspberry Pi must immediately fetch the updated state from the Webapp's REST API using the following mapping:

        | Update Type | Webapp Sync Endpoint to Call |
        | :--- | :--- |
        | **LIMITS** | `GET /raspberry-pis/{piId}/sync/limits` |
        | **CONFIG** | `GET /raspberry-pis/{id}/config` |
        | **SENSORS** | `GET /raspberry-pis/{id}/config` (Update BLE whitelist) |
        | **ABSENCE** | `GET /raspberry-pis/{id}/sync/occupancy` (Check Privacy Mode) |

        *Note: The Pi should perform these calls asynchronously to avoid blocking the notification acknowledgment.*
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotifyRequestDTO'
      responses:
        '200':
          description: Notification received and sync initiated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotifyResponseDTO'
        '400':
          description: Invalid updateType.
        '500':
          description: Pi could not reach the Webapp to complete the sync.

  /health:
    get:
      tags: [Health]
      summary: Periodic liveness check
      responses:
        '200':
          description: Pi is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDTO'

  /system/reboot:
    post:
      tags: [System]
      summary: Graceful software service restart
      responses:
        '202':
          description: Restart sequence initiated.

  /system/log-level:
    put:
      tags: [System]
      summary: Adjust logging verbosity
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                level: { type: string, enum: [DEBUG, INFO, WARN, ERROR] }
      responses:
        '200':
          description: Log level changed.

  /system/storage-cleanup:
    post:
      tags: [System]
      summary: Clear local DB cache
      description: Deletes sensor data that has been successfully transmitted.
      responses:
        '204':
          description: Cache cleared.

components:
  schemas:
    NotifyRequestDTO:
      type: object
      required: [updateType, triggeredAt]
      properties:
        updateType:
          type: string
          enum: [LIMITS, SENSORS, ABSENCE, CONFIG]
        triggeredAt:
          type: string
          format: date-time

    NotifyResponseDTO:
      type: object
      required: [status, updateType]
      properties:
        status:
          type: string
          enum: [ACCEPTED, FAILED]
        updateType: { type: string }
        message: { type: string }

    HealthDTO:
      type: object
      required: [piId, status]
      properties:
        piId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, OFFLINE] }
        lastSyncAt: { type: string, format: date-time }
        uptimeSeconds: { type: integer }
        connectedSensorCount: { type: integer }
        privacyModeActive: { type: boolean }
        cpuLoad: { type: number }
        storageUsagePercent: { type: integer }

    ErrorDTO:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detail: { type: string }