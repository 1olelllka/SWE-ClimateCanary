version: '3.8'

services:
  iot-gateway:
    build: .
    container_name: iot-gateway
    restart: always
    network_mode: host 
    privileged: true 
    volumes:
      - /home/data:/app/data
      - /home/logs:/app/logs
      - .:/app
    environment:
      - ROOM_ID=${ROOM_ID}
      - API_URL=${API_URL}
      - CONFIG_PATH=/app/data/config.yaml
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
