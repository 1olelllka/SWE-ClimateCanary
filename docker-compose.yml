services:
  app:
    build: ./webapp
    image: skel-app
    container_name: "${TEAM_NAME:-local}-app"
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_JWT_SECRET: "${APP_JWT_SECRET}"
  redis:
    image: "redis:7.2.6"
    container_name: "${TEAM_NAME:-local}-redis"
    ports:
      - "6379:6379"
    volumes:
      - "redis_data:/data"
  postgres:
    container_name: "${TEAM_NAME:-local}-postgres"
    image: "postgres:16.4"
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sa}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-passwd}
      - POSTGRES_DB=ClimateCanary
    volumes:
      - "postgres_data:/var/lib/postgresql/data"

volumes:
  redis_data:
  postgres_data: