## base application.properties file

# use dev profile if no other profile is active
spring.profiles.active=dev

# database config
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/ClimateCanary
spring.datasource.username=sa
spring.datasource.password=passwd
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
#spring.h2.console.enabled=true
spring.jpa.defer-datasource-initialization=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.url=/api-docs
springdoc.swagger-ui.config-url=/api-docs/swagger-config

spring.cloud.discovery.enabled=false
spring.cloud.compatibility-verifier.enabled=false
# rest config
cors.allowed-origins=http://localhost:3000,https://localhost:3000,localhost:3000
cors.allowed-methods=*
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=1800

spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT Properties
# change this
app.seeder.default-password=passwrd
app.seeder.climate-history.enabled=true
app.seeder.climate-history.days=50
app.aggregation.run-on-startup=true

# Batch inserts for climate history seeder performance
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
app.jwt.
# 24h (for dev purposes)
app.jwt.expirationMs=86400000
# important: whitespace at end part of prefix!
app.jwt.token.prefix=Bearer 
app.jwt.token.header=Authorization
app.jwt.token.type=JWT
app.jwt.token.issuer=skel-api
app.jwt.token.audience=skel-ui
app.jwt.login.url=/authentication/login

# Email / SMTP (fill in your credentials)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Sender address shown in "From:" header
app.mail.from=your-email@gmail.com