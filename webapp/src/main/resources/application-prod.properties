# production settings

# no h2 console in production
spring.h2.console.enabled=false

spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://G1T4-postgres:5432/ClimateCanary
spring.datasource.username=sa
spring.datasource.password=passwd
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.url=/api-docs
springdoc.swagger-ui.config-url=/api-docs/swagger-config


spring.cloud.discovery.enabled=false
spring.cloud.compatibility-verifier.enabled=false

# do we have logging at all?
logging.level.root=INFO


############### for prod #######################
# frontend served by backend; no cors calls expected; i.e. same origin expected
cors.allowed-origins=
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=Authorization,Content-Type
cors.allow-credentials=true
cors.max-age=1800

spring.data.redis.host=G1T4-redis
spring.data.redis.port=6379

# JWT Properties
# overridden via env var / deployment
app.jwt.secret=${APP_JWT_SECRET}
# 1h (for prod)
app.jwt.expirationMs=3600000
# important: whitespace at end part of prefix!
app.jwt.token.prefix=Bearer 
app.jwt.token.header=Authorization
app.jwt.token.type=JWT
app.jwt.token.issuer=skel-api
app.jwt.token.audience=skel-ui
app.jwt.login.url=/authentication/login
